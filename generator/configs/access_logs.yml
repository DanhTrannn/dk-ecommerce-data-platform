# Quy luật hành vi duyệt web cho log tổng hợp; không phụ thuộc preset quy mô (small/10m/50m).
# Nguồn: notebooks/browsing_behavior_eda.ipynb (mục §), eCommerce Behavior 2–31/10/2019, tham số theo nhóm apparel.
#   transfer   = đo ở một cửa hàng đa ngành ở Nga, áp sang shop thời trang Việt Nam như giả định chuyển nguồn
#   assumption = tham số kịch bản, không có dữ liệu để đo
schema_version: 1
window_days: 30  # assumption: log lịch sử phủ 30 ngày cuối của lịch sử OLTP

sessions:
  source: transfer
  # L1 §1: phiên không mua = value × phiên có mua (r ổn định theo ngày; toàn bộ dữ liệu cho 13,6).
  # Nhạy với định nghĩa phiên apparel: khoảng hợp lý 31,3–51,6; value quyết định tổng lưu lượng log.
  non_buying_per_buying:
    value: 41.39
  # L2 §2: số lượt xem sản phẩm mỗi phiên (≥ 1).
  views_per_session:
    buying:
      model: geometric  # lệch tối đa 6,4 điểm %; thực tế có đỉnh ở 2 lượt
      p: 0.1044
    non_buying:
      model: zero_truncated_log_series  # lệch tối đa 1,3 điểm %
      theta: 0.9239

funnel:
  # L3 §3: hiệu chỉnh ghi nhận thiếu không ổn định giữa hai khối ngày
  # (lệch 7,1 điểm % > ngưỡng 5) → dùng số gộp cả tháng (đã hiệu chỉnh) làm giả định.
  # Biểu diễn theo từng loại phiên để ghép được với sessions.non_buying_per_buying bất kỳ;
  # tỷ lệ "thêm giỏ thì mua" là kết quả suy ra (≈ 0,48 với r = 13,6; ≈ 0,25 với r = 41,4).
  source: assumption
  non_buying_cart_rate: 0.0744  # phần phiên không mua có thêm giỏ
  abandoned_items_per_buying_session: 0.0863  # sản phẩm thêm giỏ nhưng không mua, mỗi phiên có mua
  cart_items_per_non_buying_cart_session: 1.065  # sản phẩm trong giỏ của phiên không mua có thêm giỏ

timing:
  source: transfer
  # L4 §4: giây giữa hai request liên tiếp trong phiên.
  event_gap_seconds:
    model: lognormal
    median: 36.2
    sigma: 0.938

products:
  source: transfer
  # L5 §5: trọng số xem = trọng số mua OLTP ^ exponent; trong phiên mua, tỷ lệ lượt xem là sản phẩm được mua.
  views_vs_purchases_exponent: 1.0307
  purchased_product_view_share: 0.3181

journey:
  source: transfer
  # L6 §6: số phiên xem trước của một lượt mua = X − 1, X ~ log-series(theta).
  prior_sessions:
    model: shifted_log_series
    theta: 0.716
  # Khoảng cách từ lần xem đầu tới lúc mua ~ mũ (trung bình, ngày), cắt ở max_days.
  # Trung vị mũ 2,2 ngày so với thực tế 1,5: mô hình thiếu khách quay lại rất nhanh.
  days_first_view_to_purchase:
    model: exponential
    mean: 3.16
    max_days: 14

assumptions:
  source: assumption  # §7
  anonymous_non_buying_share: 0.6
  request_steps:
    category_list_or_search_before_first_view: 1.0
    cart_read_before_checkout: 1.0
    checkout_quote_before_submit: 1.0
  sale_day_traffic_follows_orders: true
  session_hour_follows_order_hour: true
