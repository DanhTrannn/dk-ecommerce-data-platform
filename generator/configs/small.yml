# Generator v2: mỗi khối ghi `source`:
#   measured   = đo trong notebooks/reference_datasets_eda.ipynb (mục §)
#   transfer   = quy luật đo ở nguồn khác, áp sang shop Việt Nam như một giả định chuyển nguồn
#   assumption = tham số kịch bản/chính sách, không có dữ liệu để ước lượng
# Tổng số đơn KHÔNG phải đầu vào: là kết quả của customers.purchase_frequency × scale.buying_customers.
# Ước lượng: đơn kỳ vọng = buying_customers × (−θ/((1−θ)·ln(1−θ))), θ = T/(α+T); T = 1 năm → 3,846 đơn/khách.
schema_version: 2
scenario_id: small-fashion-v2
seed: 20260724
anchor_time: '2026-07-01T00:00:00+00:00'
history_months: 12
business_timezone: Asia/Ho_Chi_Minh

scale:
  buying_customers: 500  # ≈ 1.923 đơn kỳ vọng
  registered_without_order_ratio: 0.1  # assumption: tài khoản chưa mua / khách đã mua; H&M chỉ quan sát khách đã mua (§7)
  products: 60

customers:
  purchase_frequency:
    # Số đơn k ≥ 1 của khách đã mua ~ log-series(θ), θ = T/(α+T), T = history_months/12 (năm).
    model: zero_truncated_log_series
    alpha_years: 0.1141
    source: measured  # §1, §1.1 — H&M online 2019; α từ 6 tháng dự báo được 3 và 12 tháng
  repeat_gap:
    # Khoảng cách giữa hai đơn liên tiếp ~ Exponential(mean = T_days·(1 − c/k)/(k+1)), làm tròn ≥ 1 ngày.
    model: exponential
    shrink_c: 0.518
    source: measured  # §2 — H&M online 2019; khách mua ít lần có đơn gần nhau hơn

products:
  popularity:
    # Trọng số nhu cầu w ~ LogNormal(0, σ) × categories.<code>.demand_multiplier.
    model: lognormal
    sigma: 1.35  # độ lệch chuẩn của log(số bán)
    source: measured  # §3 — sản phẩm H&M nữ bán đủ 12 tháng
  categories:
    # product_share chia số sản phẩm; demand_multiplier = demand_share/product_share.
    source: measured  # §3.1 — ánh xạ product_type H&M → nhóm shop là giả định
    ao: {product_share: 0.3487, demand_multiplier: 1.190}
    quan: {product_share: 0.1353, demand_multiplier: 1.723}
    dam: {product_share: 0.1954, demand_multiplier: 0.887}
    khoac: {product_share: 0.0758, demand_multiplier: 0.656}
    vay: {product_share: 0.0569, demand_multiplier: 0.814}
    giay: {product_share: 0.0524, demand_multiplier: 0.724}
    phu-kien: {product_share: 0.1112, demand_multiplier: 0.315}
    tui-xach: {product_share: 0.0243, demand_multiplier: 0.386}
  price_independent_of_popularity: true  # measured §3.1 — Spearman ≈ 0,01
  variants_per_product: 4  # assumption: tổ hợp size/màu trong catalog
  price_bands:
    # Trung bình ≈ 234.000 đ: cao hơn mặt bằng thời trang nữ trên sàn (≈ 119.000–207.000 đ/sản phẩm,
    # Metric 10/2025 qua tin dẫn lại, §7.1) vì là shop thương hiệu. Giá H&M là thang chuẩn hóa, không dùng được.
    source: assumption
    bands:
      - {min_vnd: 79000, max_vnd: 149000, weight: 35}
      - {min_vnd: 149000, max_vnd: 249000, weight: 35}
      - {min_vnd: 249000, max_vnd: 399000, weight: 20}
      - {min_vnd: 399000, max_vnd: 799000, weight: 10}

baskets:
  # Lấy mẫu độc lập với khách (Spearman ≈ 0,02, §4).
  source: transfer  # §4 — H&M online (shop một thương hiệu); Olist kiểu sàn cho giỏ nhỏ hơn nhiều
  products:
    # Sau mỗi sản phẩm, thêm sản phẩm khác với xác suất 1 − p (trung bình 1/p ≈ 3,4).
    model: geometric
    p: 0.296
  # Bảng tần suất % cho giá trị 1, 2, 3 (3 đại diện cho "3+").
  variants_per_product: [92.1, 7.0, 1.0]
  quantity_per_variant: [86.9, 11.6, 1.4]

calendar:
  # Cường độ đặt đơn theo ngày = day_of_week × sale_events × tet.
  day_of_week:
    source: measured  # §5 — không có hình dạng chung giữa H&M/Olist → để đều
    weights: [1, 1, 1, 1, 1, 1, 1]
  hour_of_day:
    source: transfer  # §5 — Olist 2017, giờ địa phương; ngày sale có đỉnh 0–1h
    normal: [0.0251, 0.0127, 0.0056, 0.0028, 0.0023, 0.0021, 0.0047, 0.0117, 0.0282, 0.0456, 0.0602, 0.0663, 0.0602, 0.0667, 0.0653, 0.0651, 0.0662, 0.0622, 0.0566, 0.0608, 0.0619, 0.0635, 0.0596, 0.0447]
    sale_day: [0.0468, 0.0315, 0.0136, 0.0043, 0.0034, 0.0026, 0.0077, 0.0145, 0.0349, 0.0468, 0.0638, 0.0476, 0.0544, 0.0646, 0.057, 0.0578, 0.0485, 0.0451, 0.0417, 0.0536, 0.0544, 0.0655, 0.074, 0.0663]
  sale_events:
    # Black Friday ÷ trung vị 28 ngày trước, trung bình H&M (×5,55) và Olist (×7,24);
    # áp cho các ngày sale lớn ở VN là chuyển nguồn.
    source: transfer  # §5
    event_day_multiplier: 6.39
    after_days: 3
    after_multiplier: 2.6
    dates:
      - {name: '11-11', month: 11, day: 11}
      - {name: '12-12', month: 12, day: 12}
      - {name: black_friday, month: 11, weekday: 3, week_index: 4, offset_days: 1}  # ngày sau thứ Năm thứ tư
  tet:
    # Không có dữ liệu VN theo ngày; ngày Tết âm lịch ghi tường minh cho từng năm trong lịch sử.
    source: assumption
    dates: ['2026-02-17']
    before_days: 14
    before_multiplier: 1.5
    holiday_days: 5
    holiday_multiplier: 0.3

fulfilment:
  on_time_delivery_days: [2, 6]  # assumption, lấy đều; iPrice/Parcel Perform: VN trung bình 5–6 ngày (§7.1)
  late_rate: 0.055  # transfer §6 — Olist 2017
  late_buckets:  # transfer §6 — tỷ trọng % trong các đơn trễ; số ngày trễ lấy đều trong khoảng
    late_1_3: {days: [1, 3], share: 29.2}
    late_4_7: {days: [4, 7], share: 26.6}
    late_8_plus: {days: [8, 14], share: 44.3}

reviews:
  rating_by_lateness:
    # % số sao 1..5 theo mức trễ, đo trực tiếp.
    source: measured  # §6 — Olist 2017
    on_time: [6.4, 2.8, 8.4, 20.8, 61.6]
    late_1_3: [26.2, 7.8, 13.4, 19.9, 32.8]
    late_4_7: [55.9, 8.8, 10.1, 7.7, 17.4]
    late_8_plus: [68.1, 9.8, 8.4, 5.3, 8.4]
  write_rate: 0.35  # assumption: Olist khảo sát mọi đơn
  status_weights: {approved: 94, rejected: 6}  # assumption
  delay_days: [1, 14]  # assumption

# Tham số kịch bản: không nguồn nào đo được cho shop VN (§7). Là xác suất lấy mẫu, không phải thống kê.
outcomes:
  source: assumption
  cancellation_rate: 0.08
  cod_rate: 0.6
  cod_failure_rate: 0.08
  return_rate: 0.06
  exchange_rate: 0.5
  cancellation_reasons:
    Đặt nhầm size hoặc màu: 28
    Muốn thay đổi địa chỉ nhận hàng: 18
    Tìm thấy lựa chọn phù hợp hơn: 18
    Áp nhầm mã giảm giá: 14
    Không còn nhu cầu mua: 22

coupons:
  source: assumption
  usage_rate: 0.25
  sale_day_usage_rate: 0.45
  percentage: 10
  sale_day_percentage: 15
  minimum_subtotal_vnd: 199000

# Chính sách vận hành và khoảng lấy mẫu; không đổi cấu hình API nguồn.
policies:
  history:
    master_data_lead_days: 30
  customers:
    house_number_range: [1, 999]
    female_name_rate: 0.8
    inactive_rate: 0.04
    created_before_history_days: [1, 180]
    inactive_before_anchor_days: [1, 60]
  catalog:
    archive_rate: 0.05
    price_step_vnd: 1000
    cost_ratio_range: [0.35, 0.45]  # lấy đều mỗi biến thể, không theo chỉ số biến thể
  shipping:
    fee_vnd: 30000
    # assumption: ≈ trung vị giá trị đơn mô phỏng (≈ 692.000 đ) → khoảng 50% đơn trả phí ship (500.000 đ → 38%)
    free_from_subtotal_vnd: 700000
    failed_attempts: 3
    attempt_interval_hours: 6
    failure_after_days: 2
    cod_block_after_failures: 3
  timing:
    cancellation_min_age_hours: 2
    confirmation_min_age_hours: 8
    failure_min_age_days: 3
    confirmation_delay_hours: [2, 18]
    cancellation_delay_minutes: [15, 480]
    minute_of_hour: [0, 59]
  returns:
    item_selection: uniform  # tránh lệch: luôn chọn món đầu theo variant_id
    replacement_selection: uniform
    quantity: 1
    request_delay_days: 2
    processing_delay_days: 1
  inventory:
    buffer_units: [80, 200]
  coupons:
    start_before_history_days: 1
    valid_after_anchor_days: 365
    minimum_total_usage_limit: 100
    extra_total_usage_limit: 100
    ordinary_customer_usage_limit: 10
    sale_day_customer_usage_limit: 1
  reviews:
    extra_delay_hours: [0, 23]
    moderation_delay_hours: [1, 48]
  wishlist:
    creation_rate: 0.55
    item_count: [1, 5]
    purchased_share: 0.4
    minimum_purchased_items: 1
    added_before_purchase_days: [1, 30]
    added_before_purchase_hours: [0, 23]
    readded_after_days: [0, 7]
    unpurchased_readded_after_days: [0, 29]
    removal_rate: 0.18
    removed_after_days: [0, 14]
  carts:
    checkout_lead_minutes: [5, 10080]
    stale_rate: 0.65
    stale_before_anchor_days: [2, 20]
    recent_before_anchor_hours: [1, 12]
    created_before_update_hours: [1, 72]
    active_item_count: [1, 3]
    active_quantity: [1, 3]
