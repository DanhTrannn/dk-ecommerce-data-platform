[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "data-generator"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = [
  "numpy==2.4.6",
  "polars==2.1.0",
  "psycopg2-binary==2.9.10",
  "pydantic==2.11.7",
  "PyYAML==6.0.2",
]

[project.scripts]
datagen = "datagen.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"
