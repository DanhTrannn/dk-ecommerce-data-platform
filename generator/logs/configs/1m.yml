# Quy luật hành vi duyệt web cho log tổng hợp, preset 1m (đi cùng generator/oltp/configs/1m.yml).
# Nguồn: notebooks/browsing_behavior_eda.ipynb (mục §), eCommerce Behavior 2–31/10/2019 (L4: 11/2019), nhóm apparel.
#   transfer   = đo ở một cửa hàng đa ngành ở Nga, áp sang shop thời trang Việt Nam như giả định chuyển nguồn
#   assumption = tham số kịch bản, không đo trong notebook
# Lượng log KHÔNG phải đầu vào: phiên có mua = đơn OLTP trong cửa sổ, các phiên khác suy ra từ quy luật bên dưới.
# Ba preset dùng chung quy luật, chỉ khác scenario_id và oltp_scenario_id.
#
# Lượng log đo ở lần chạy 1m (01/11–15/12/2025, 45 ngày): 206.632 phiên có mua, 7.147.494 phiên không mua,
#   45.083.918 request, 2,4 GB Parquet, 195 giây.
schema_version: 3
scenario_id: 1m-fashion-logs-v1
oltp_scenario_id: 1m-fashion-v2  # chỉ sinh trên dữ liệu OLTP tạo từ preset này
seed: 20260725  # assumption: khác seed OLTP để log không dùng chung chuỗi ngẫu nhiên với đơn
window:  # assumption: mùa sale 11-11, Black Friday, 12-12 và 3 ngày sau mỗi đợt; ngày giờ Việt Nam, end loại trừ
  start: 2025-11-01
  end: 2025-12-16

sessions:
  source: transfer
  # L1 §1: phiên không mua = value × phiên có mua (r ổn định theo ngày; toàn bộ dữ liệu cho 13,6).
  # Nhạy với định nghĩa phiên apparel: khoảng hợp lý 31,3–51,6; value quyết định tổng lưu lượng log.
  non_buying_per_buying:
    value: 41.39
  # L4 §4: ngày sự kiện sale, r × hệ số (đo một đợt sale duy nhất, ngày 17/11/2019).
  sale_day_ratio_multiplier: 0.35
  # L2 §2: số lượt xem sản phẩm mỗi phiên (≥ 1).
  views_per_session:
    buying:
      model: geometric  # lệch tối đa 6,4 điểm %; thực tế có đỉnh ở 2 lượt
      p: 0.1044
    non_buying:
      model: zero_truncated_log_series  # lệch tối đa 1,3 điểm %
      theta: 0.9239

timing:
  source: transfer
  # L3 §3: giây giữa hai request liên tiếp trong phiên.
  event_gap_seconds:
    model: lognormal
    median: 36.2
    sigma: 0.938

funnel:
  # §5: nguồn ghi thiếu sự kiện giỏ nên không đo ổn định; làm tròn từ phép đo gộp cũ.
  source: assumption
  non_buying_cart_rate: 0.075  # phần phiên không mua thêm 1 sản phẩm vào giỏ rồi bỏ đi

products:
  # §5: trọng số xem = trọng số mua OLTP (số mũ đo được ≈ 1,03).
  source: assumption
  views_proportional_to_purchases: true

assumptions:
  source: assumption  # §5
  request_steps:
    category_list_or_search_before_first_view: 1.0
    cart_read_before_checkout: 1.0
    checkout_quote_before_submit: 1.0
  sale_day_traffic_follows_orders: true
  session_hour_follows_order_hour: true
