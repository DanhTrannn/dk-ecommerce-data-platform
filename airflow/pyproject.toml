[project]
name = "batch-pipeline"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = [
  "boto3==1.43.75",
  "pyarrow==18.1.0",
  "dbt-core==1.11.11",
  "dbt-trino==1.11.0",
  "polars==2.1.0",
  "pyiceberg[pyarrow,pyiceberg-core]==0.12.0",
  "psycopg[binary]==3.3.5",
  "trino==0.340.0",
]

[tool.setuptools.packages.find]
include = ["lakehouse*"]

[tool.setuptools.package-data]
lakehouse = ["sql_templates/**/*.sql"]
