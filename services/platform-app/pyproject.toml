[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "platform-app"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = [
  "data-generator",
  "PyYAML==6.0.2",
  "streamlit==1.66.1",
  "argon2-cffi==25.1.0",
  "email-validator==2.2.0",
  "fastapi==0.116.1",
  "httpx==0.28.1",
  "PyJWT==2.10.1",
  "PyMySQL[rsa]==1.1.1",
  "psycopg2-binary==2.9.10",
  "pydantic==2.11.7",
  "pydantic-settings==2.10.1",
  "SQLAlchemy==2.0.41",
  "uvicorn[standard]==0.35.0",
  "aiokafka==0.11.0",
  "anyio==4.14.2",
  "starlette==0.47.3",
  "cryptography==49.0.0",
]

[project.scripts]
platform-app = "platform_app.ui.launcher:main"

[tool.uv.sources]
data-generator = { workspace = true }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"
