[project]
name = "lakehouse-workspace"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = []

[tool.uv]
package = false

[tool.uv.workspace]
members = [
  "generator",
  "pipelines",
  "services/platform-app",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = [
  "E",     # Error rules
  "F",     # Pyflakes rules
  "W",     # Warning rules
]
ignore = [
  "E501",  # Line too long
  "E712",  # Comparison to True (SQLAlchemy boolean column expressions)
  "E402",  # Module level import not at top of file (sys.path injection)
]

[dependency-groups]
eda = [
    "ipykernel==7.4.0",
    "matplotlib==3.11.2",
    "nbconvert==7.17.2",
    "polars==2.1.0",
    "seaborn==0.13.2",
]


