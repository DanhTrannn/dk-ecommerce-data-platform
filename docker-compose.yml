x-airflow-common: &airflow-common
  build:
    context: .
    dockerfile: infrastructure/airflow/Dockerfile
    args:
      ICEBERG_VERSION: ${ICEBERG_VERSION:-1.10.1}
  image: lakehouse-airflow:3.3.2
  profiles: ["core"]
  user: "${AIRFLOW_UID:-50000}:0"
  environment: &airflow-environment
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY:-}
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${AIRFLOW_DB_USER:-airflow}:${AIRFLOW_DB_PASSWORD:-password}@postgres:5432/${AIRFLOW_DB_NAME:-airflow}
    AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-api-server:8080/execution/
    AIRFLOW__SCHEDULER__CREATE_CRON_DATA_INTERVALS: "true"
    AIRFLOW__API__SECRET_KEY: ${AIRFLOW_SECRET_KEY:-change-me-airflow-secret}
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET:-change-me-airflow-jwt-secret}
    PYTHONPATH: /opt/project/pipelines/src
    POSTGRES_SOURCE_HOST: postgres
    POSTGRES_SOURCE_PORT: "5432"
    POSTGRES_ECOMMERCE_DB: ${POSTGRES_ECOMMERCE_DB:-ecommerce}
    POSTGRES_ECOMMERCE_READER_USER: ${POSTGRES_ECOMMERCE_READER_USER:-ecommerce_reader}
    POSTGRES_ECOMMERCE_READER_PASSWORD: ${POSTGRES_ECOMMERCE_READER_PASSWORD:-}
    SPARK_MASTER_URL: ${SPARK_MASTER_URL:-local[2]}
    AIRFLOW_CONN_SPARK_DEFAULT: '{"conn_type":"spark","host":"${SPARK_MASTER_URL:-local[2]}"}'
    MINIO_ENDPOINT: http://minio:9000
    MINIO_LAKEHOUSE_BUCKET: ${MINIO_LAKEHOUSE_BUCKET:-lakehouse}
    MINIO_SPARK_ACCESS_KEY: ${MINIO_SPARK_ACCESS_KEY:?set MINIO_SPARK_ACCESS_KEY}
    MINIO_SPARK_SECRET_KEY: ${MINIO_SPARK_SECRET_KEY:?set MINIO_SPARK_SECRET_KEY}
    POLARIS_CATALOG_URI: http://polaris:8181/api/catalog
    POLARIS_CATALOG_NAME: ${POLARIS_CATALOG_NAME:-lakehouse}
    POLARIS_CREDENTIAL_FILE: /run/polaris/clients.env
    SILVER_PSEUDONYMIZE_SALT: ${SILVER_PSEUDONYMIZE_SALT:-}
    AWS_REGION: ${AWS_REGION:-us-east-1}
  volumes:
    - ./airflow/dags:/opt/airflow/dags:ro
    - ./pipelines:/opt/project/pipelines:ro
    - airflow-logs:/opt/airflow/logs
    - polaris-spark-airflow-credentials:/run/polaris:ro
  networks: ["lakehouse-network"]
  depends_on:
    postgres:
      condition: service_healthy

x-flink-common: &flink-common
  build:
    context: .
    dockerfile: infrastructure/flink/Dockerfile
    args:
      FLINK_VERSION: "1.19"
      ICEBERG_VERSION: ${ICEBERG_VERSION:-1.10.1}
  image: lakehouse-flink:1.19-iceberg-${ICEBERG_VERSION:-1.10.1}
  profiles: ["streaming"]
  environment: &flink-environment
    POLARIS_REALM: ${POLARIS_REALM:-POLARIS}
    POLARIS_CREDENTIAL_FILE: /run/polaris/clients.env
    AWS_REGION: ${AWS_REGION:-us-east-1}
    MINIO_FLINK_ACCESS_KEY: ${MINIO_FLINK_ACCESS_KEY:?set MINIO_FLINK_ACCESS_KEY}
    MINIO_FLINK_SECRET_KEY: ${MINIO_FLINK_SECRET_KEY:?set MINIO_FLINK_SECRET_KEY}
    MINIO_ENDPOINT: http://minio:9000
    KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    CDC_TOPIC_PREFIX: ${CDC_TOPIC_PREFIX:-ecommerce}
    PYTHONPATH: /opt/project/pipelines/src
  networks: ["lakehouse-network"]

x-polaris-database-environment: &polaris-database-environment
  POLARIS_PERSISTENCE_TYPE: relational-jdbc
  POLARIS_PERSISTENCE_RELATIONAL_JDBC_DATABASE_TYPE: postgresql
  QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://postgres:5432/${POLARIS_DB_NAME:-polaris}
  QUARKUS_DATASOURCE_USERNAME: ${POLARIS_DB_USER:-polaris}
  QUARKUS_DATASOURCE_PASSWORD: ${POLARIS_DB_PASSWORD:-password}

services:
  minio:
    image: cgr.dev/chainguard/minio:latest-dev
    command: server /data --console-address ":9001"
    profiles: ["core"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}
      MINIO_LAKEHOUSE_BUCKET: ${MINIO_LAKEHOUSE_BUCKET:-lakehouse}
      MINIO_POLARIS_ACCESS_KEY: ${MINIO_POLARIS_ACCESS_KEY:?set MINIO_POLARIS_ACCESS_KEY}
      MINIO_POLARIS_SECRET_KEY: ${MINIO_POLARIS_SECRET_KEY:?set MINIO_POLARIS_SECRET_KEY}
      MINIO_SPARK_ACCESS_KEY: ${MINIO_SPARK_ACCESS_KEY:?set MINIO_SPARK_ACCESS_KEY}
      MINIO_SPARK_SECRET_KEY: ${MINIO_SPARK_SECRET_KEY:?set MINIO_SPARK_SECRET_KEY}
      MINIO_FLINK_ACCESS_KEY: ${MINIO_FLINK_ACCESS_KEY:?set MINIO_FLINK_ACCESS_KEY}
      MINIO_FLINK_SECRET_KEY: ${MINIO_FLINK_SECRET_KEY:?set MINIO_FLINK_SECRET_KEY}
      MINIO_TRINO_ACCESS_KEY: ${MINIO_TRINO_ACCESS_KEY:?set MINIO_TRINO_ACCESS_KEY}
      MINIO_TRINO_SECRET_KEY: ${MINIO_TRINO_SECRET_KEY:?set MINIO_TRINO_SECRET_KEY}
    ports:
      - "${MINIO_BIND_ADDRESS:-127.0.0.1}:${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_BIND_ADDRESS:-127.0.0.1}:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
      - ./infrastructure/minio:/opt/project/minio:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: ["lakehouse-network"]

  postgres:
    image: postgres:16.8
    profiles: ["core"]
    command: ["postgres", "-c", "wal_level=logical", "-c", "max_replication_slots=4", "-c", "max_wal_senders=4"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_ECOMMERCE_DB: ${POSTGRES_ECOMMERCE_DB:-ecommerce}
      POSTGRES_ECOMMERCE_USER: ${POSTGRES_ECOMMERCE_USER:-ecommerce_app}
      POSTGRES_ECOMMERCE_PASSWORD: ${POSTGRES_ECOMMERCE_PASSWORD:-password}
      POSTGRES_ECOMMERCE_READER_USER: ${POSTGRES_ECOMMERCE_READER_USER:-ecommerce_reader}
      POSTGRES_ECOMMERCE_READER_PASSWORD: ${POSTGRES_ECOMMERCE_READER_PASSWORD:-}
      POSTGRES_CDC_USER: ${POSTGRES_CDC_USER:-debezium}
      POSTGRES_CDC_PASSWORD: ${POSTGRES_CDC_PASSWORD:-password}
      POLARIS_DB_NAME: ${POLARIS_DB_NAME:-polaris}
      POLARIS_DB_USER: ${POLARIS_DB_USER:-polaris}
      AIRFLOW_DB_NAME: ${AIRFLOW_DB_NAME:-airflow}
      AIRFLOW_DB_USER: ${AIRFLOW_DB_USER:-airflow}
      POLARIS_DB_PASSWORD: ${POLARIS_DB_PASSWORD:-password}
      AIRFLOW_DB_PASSWORD: ${AIRFLOW_DB_PASSWORD:-password}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --data-checksums"
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infrastructure/postgres/init:/docker-entrypoint-initdb.d:ro
      - ./infrastructure/postgres/configure-source-reader.sh:/opt/project/configure-source-reader.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: ["lakehouse-network"]

  polaris-bootstrap:
    image: apache/polaris-admin-tool:1.8.0
    profiles: ["core"]
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set +e
        output="$$(java -jar /deployments/polaris-admin-tool.jar bootstrap \
          --realm="$${POLARIS_REALM}" \
          --credential="$${POLARIS_REALM},$${POLARIS_ROOT_CLIENT_ID},$${POLARIS_ROOT_CLIENT_SECRET}" 2>&1)"
        status=$$?
        if [ "$$status" -eq 0 ]; then
          printf '%s\n' "$$output"
          exit 0
        fi
        if printf '%s' "$$output" | grep -q 'already been bootstrapped'; then
          echo "Realm already exists; bootstrap is complete."
          exit 0
        fi
        printf '%s\n' "$$output" >&2
        exit "$$status"
    environment:
      <<: *polaris-database-environment
      POLARIS_REALM: ${POLARIS_REALM:-POLARIS}
      POLARIS_ROOT_CLIENT_ID: ${POLARIS_ROOT_CLIENT_ID:-root}
      POLARIS_ROOT_CLIENT_SECRET: ${POLARIS_ROOT_CLIENT_SECRET:-password}
    depends_on:
      postgres:
        condition: service_healthy
    networks: ["lakehouse-network"]

  polaris:
    image: apache/polaris:1.8.0
    profiles: ["core"]
    environment:
      <<: *polaris-database-environment
      POLARIS_PERSISTENCE_RELATIONAL_JDBC_MAX_RETRIES: 5
      POLARIS_PERSISTENCE_RELATIONAL_JDBC_INITIAL_DELAY_IN_MS: 100
      POLARIS_PERSISTENCE_RELATIONAL_JDBC_MAX_DURATION_IN_MS: 5000
      POLARIS_REALM_CONTEXT_REALMS: ${POLARIS_REALM:-POLARIS}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${MINIO_POLARIS_ACCESS_KEY:?set MINIO_POLARIS_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${MINIO_POLARIS_SECRET_KEY:?set MINIO_POLARIS_SECRET_KEY}
      QUARKUS_OTEL_SDK_DISABLED: "true"
      QUARKUS_HTTP_CORS_ENABLED: "true"
      QUARKUS_HTTP_CORS_ORIGINS: ${POLARIS_CONSOLE_ORIGIN:-http://localhost:8183}
      QUARKUS_HTTP_CORS_METHODS: GET,POST,PUT,DELETE,PATCH,OPTIONS
      QUARKUS_HTTP_CORS_HEADERS: Content-Type,Authorization,Polaris-Realm,X-Request-ID
    ports:
      - "${POLARIS_BIND_ADDRESS:-127.0.0.1}:${POLARIS_API_PORT:-8181}:8181"
      - "${POLARIS_BIND_ADDRESS:-127.0.0.1}:${POLARIS_MANAGEMENT_PORT:-8182}:8182"
    depends_on:
      minio:
        condition: service_healthy
      polaris-bootstrap:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8182/q/health"]
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 15s
    networks: ["lakehouse-network"]

  spark-client:
    build:
      context: .
      dockerfile: infrastructure/spark/Dockerfile
      args:
        ICEBERG_VERSION: ${ICEBERG_VERSION:-1.10.1}
    image: lakehouse-spark:3.5.9-iceberg-${ICEBERG_VERSION:-1.10.1}
    profiles: ["batch"]
    entrypoint: ["/opt/project/spark/with-polaris-credentials.sh"]
    environment:
      SPARK_MASTER_URL: ${SPARK_MASTER_URL:-local[2]}
      POSTGRES_SOURCE_HOST: postgres
      POSTGRES_SOURCE_PORT: "5432"
      POSTGRES_ECOMMERCE_DB: ${POSTGRES_ECOMMERCE_DB:-ecommerce}
      POSTGRES_ECOMMERCE_READER_USER: ${POSTGRES_ECOMMERCE_READER_USER:-ecommerce_reader}
      POSTGRES_ECOMMERCE_READER_PASSWORD: ${POSTGRES_ECOMMERCE_READER_PASSWORD:-}
      MINIO_LAKEHOUSE_BUCKET: ${MINIO_LAKEHOUSE_BUCKET:-lakehouse}
      POLARIS_CATALOG_URI: http://polaris:8181/api/catalog
      POLARIS_CATALOG_NAME: ${POLARIS_CATALOG_NAME:-lakehouse}
      SILVER_PSEUDONYMIZE_SALT: ${SILVER_PSEUDONYMIZE_SALT:-}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      PYTHONPATH: /opt/project/pipelines/src
      MINIO_ENDPOINT: http://minio:9000
      MINIO_SPARK_ACCESS_KEY: ${MINIO_SPARK_ACCESS_KEY:?set MINIO_SPARK_ACCESS_KEY}
      MINIO_SPARK_SECRET_KEY: ${MINIO_SPARK_SECRET_KEY:?set MINIO_SPARK_SECRET_KEY}
      POLARIS_REALM: ${POLARIS_REALM:-POLARIS}
    command: ["sleep", "infinity"]
    volumes:
      - polaris-spark-client-credentials:/run/polaris:ro
      - ./pipelines:/opt/project/pipelines:ro
    depends_on:
      polaris:
        condition: service_healthy
    networks: ["lakehouse-network"]

  airflow-init:
    <<: *airflow-common
    command:
      - bash
      - -c
      - >-
        airflow db migrate &&
        (airflow users create
        --username $${AIRFLOW_ADMIN_USER}
        --password $${AIRFLOW_ADMIN_PASSWORD}
        --firstname Web
        --lastname Admin
        --role Admin
        --email admin@example.local || true)
    environment:
      <<: *airflow-environment
      AIRFLOW_ADMIN_USER: ${AIRFLOW_ADMIN_USER:-airflow}
      AIRFLOW_ADMIN_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD:-password}

  airflow-api-server:
    <<: *airflow-common
    command: api-server
    ports:
      - "${AIRFLOW_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/api/v2/monitor/health"]
      interval: 15s
      timeout: 10s
      retries: 20
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    healthcheck:
      test: ["CMD-SHELL", "airflow jobs check --job-type SchedulerJob --hostname $${HOSTNAME}"]
      interval: 20s
      timeout: 10s
      retries: 10
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      airflow-api-server:
        condition: service_healthy

  airflow-dag-processor:
    <<: *airflow-common
    command: dag-processor
    healthcheck:
      test: ["CMD-SHELL", "airflow jobs check --job-type DagProcessorJob --hostname $${HOSTNAME}"]
      interval: 20s
      timeout: 10s
      retries: 10
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  trino:
    image: trinodb/trino:483
    profiles: ["core"]
    entrypoint: ["/bin/sh", "/opt/trino/start.sh"]
    environment:
      POLARIS_CREDENTIAL_FILE: /run/polaris/clients.env
      POLARIS_REALM: ${POLARIS_REALM:-POLARIS}
      MINIO_TRINO_ACCESS_KEY: ${MINIO_TRINO_ACCESS_KEY:?set MINIO_TRINO_ACCESS_KEY}
      MINIO_TRINO_SECRET_KEY: ${MINIO_TRINO_SECRET_KEY:?set MINIO_TRINO_SECRET_KEY}
    ports:
      - "${TRINO_BIND_ADDRESS:-127.0.0.1}:${TRINO_PORT:-8084}:8080"
    volumes:
      - ./infrastructure/trino/start.sh:/opt/trino/start.sh:ro
      - ./infrastructure/trino/config.properties:/etc/trino/config.properties:ro
      - ./infrastructure/trino/catalog:/etc/trino/catalog:ro
      - polaris-trino-reader-credentials:/run/polaris:ro
    depends_on:
      polaris:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/v1/info"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 30s
    networks: ["lakehouse-network"]


  lakehouse-provision:
    image: lakehouse-platform-app:0.1.0
    profiles: ["core"]
    scale: 0
    user: "0:0"
    entrypoint: ["python", "-m", "platform_app.provisioning.polaris"]
    environment:
      POLARIS_PROVISION_URL: http://polaris:8181
      POLARIS_REALM: ${POLARIS_REALM:-POLARIS}
      POLARIS_CATALOG_NAME: ${POLARIS_CATALOG_NAME:-lakehouse}
      POLARIS_ROOT_CLIENT_ID: ${POLARIS_ROOT_CLIENT_ID:-root}
      POLARIS_ROOT_CLIENT_SECRET: ${POLARIS_ROOT_CLIENT_SECRET:?set POLARIS_ROOT_CLIENT_SECRET}
      MINIO_LAKEHOUSE_BUCKET: ${MINIO_LAKEHOUSE_BUCKET:-lakehouse}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AIRFLOW_UID: ${AIRFLOW_UID:-50000}
    volumes:
      - polaris-provision-state:/run/polaris-state
      - polaris-spark-client-credentials:/run/polaris-output/spark-client
      - polaris-spark-airflow-credentials:/run/polaris-output/spark-airflow
      - polaris-flink-credentials:/run/polaris-output/flink
      - polaris-trino-reader-credentials:/run/polaris-output/trino-reader
    networks: ["lakehouse-network"]


  lakehouse-access:
    image: lakehouse-platform-app:0.1.0
    profiles: ["core"]
    user: "${PLATFORM_APP_UID:-1000}:${PLATFORM_APP_GID:-1000}"
    entrypoint: ["uvicorn", "platform_app.access_admin.app:app", "--host", "0.0.0.0", "--port", "8010", "--no-access-log"]
    environment:
      API_DATABASE_URL: postgresql+psycopg2://${POSTGRES_ECOMMERCE_USER:-ecommerce_app}:${POSTGRES_ECOMMERCE_PASSWORD:-password}@postgres:5432/${POSTGRES_ECOMMERCE_DB:-ecommerce}
      API_SECRET_KEY: ${API_SECRET_KEY:?set API_SECRET_KEY}
      API_AUTH_COOKIE_NAME: lakehouse_access
      API_CSRF_COOKIE_NAME: lakehouse_csrf
      POLARIS_REALM: ${POLARIS_REALM:-POLARIS}
      POLARIS_CATALOG_NAME: ${POLARIS_CATALOG_NAME:-lakehouse}
      POLARIS_ROOT_CLIENT_ID: ${POLARIS_ROOT_CLIENT_ID:-root}
      POLARIS_ROOT_CLIENT_SECRET: ${POLARIS_ROOT_CLIENT_SECRET:?set POLARIS_ROOT_CLIENT_SECRET}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}
      MINIO_POLARIS_ACCESS_KEY: ${MINIO_POLARIS_ACCESS_KEY:?set MINIO_POLARIS_ACCESS_KEY}
      MINIO_SPARK_ACCESS_KEY: ${MINIO_SPARK_ACCESS_KEY:?set MINIO_SPARK_ACCESS_KEY}
      MINIO_FLINK_ACCESS_KEY: ${MINIO_FLINK_ACCESS_KEY:?set MINIO_FLINK_ACCESS_KEY}
      MINIO_TRINO_ACCESS_KEY: ${MINIO_TRINO_ACCESS_KEY:?set MINIO_TRINO_ACCESS_KEY}
      ACCESS_ADMIN_AUDIT_PATH: /data/access-admin/audit.jsonl
    volumes:
      - ./data:/data
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      polaris:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8010/health/live', timeout=5).read()"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks: ["lakehouse-network"]

  platform-app:
    build:
      context: .
      dockerfile: services/platform-app/Dockerfile
    image: lakehouse-platform-app:0.1.0
    profiles: ["core"]
    user: "${PLATFORM_APP_UID:-1000}:${PLATFORM_APP_GID:-1000}"
    environment:
      HOME: /tmp
      API_DATABASE_URL: postgresql+psycopg2://${POSTGRES_ECOMMERCE_USER:-ecommerce_app}:${POSTGRES_ECOMMERCE_PASSWORD:-password}@postgres:5432/${POSTGRES_ECOMMERCE_DB:-ecommerce}
      API_SECRET_KEY: ${API_SECRET_KEY:?set API_SECRET_KEY}
      API_CORS_ORIGINS: ${API_CORS_ORIGINS:-http://localhost:8501,http://localhost:3000}
      API_CHECKOUT_MAX_RETRIES: ${API_CHECKOUT_MAX_RETRIES:-3}
      CONSOLE_ACCESS_ADMIN_URL: http://lakehouse-access:8010
      SCENARIO_API_BASE_URL: ${SCENARIO_API_BASE_URL:-http://127.0.0.1:8000}
      SCENARIO_HTTP_TIMEOUT_SECONDS: ${SCENARIO_HTTP_TIMEOUT_SECONDS:-15}
      KAFKA_ENABLED: "false"
      STREAMLIT_SERVER_HEADLESS: "true"
      STREAMLIT_BROWSER_GATHER_USAGE_STATS: "false"
    ports:
      - "${PLATFORM_APP_BIND_ADDRESS:-127.0.0.1}:${PLATFORM_APP_PORT:-8501}:8501"
      - "${PLATFORM_APP_BIND_ADDRESS:-127.0.0.1}:${API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; [urllib.request.urlopen(url, timeout=5).read() for url in ('http://localhost:8000/health/live', 'http://localhost:8501/_stcore/health')]"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks: ["lakehouse-network"]

  kafka:
    image: apache/kafka:3.8.0
    profiles: ["streaming"]
    ports:
      - "${KAFKA_PORT:-9092}:9092"
      - "9094:9094"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,EXTERNAL://0.0.0.0:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 15s
    networks: ["lakehouse-network"]

  kafka-init:
    image: apache/kafka:3.8.0
    profiles: ["streaming"]
    command:
      - /opt/kafka/bin/kafka-topics.sh
      - --bootstrap-server
      - kafka:9092
      - --create
      - --if-not-exists
      - --topic
      - ecommerce.access_logs
      - --partitions
      - "1"
      - --replication-factor
      - "1"
    depends_on:
      kafka:
        condition: service_healthy
    restart: "no"
    networks: ["lakehouse-network"]

  debezium-connect:
    build:
      context: .
      dockerfile: infrastructure/debezium/Dockerfile
      args:
        DEBEZIUM_VERSION: 3.0.8.Final
    image: lakehouse-debezium-connect:3.0.8
    profiles: ["streaming"]
    environment:
      KAFKA_HEAP_OPTS: ${CDC_CONNECT_HEAP_OPTS:--Xms256m -Xmx512m}
    ports:
      - "${CDC_CONNECT_BIND_ADDRESS:-127.0.0.1}:${CDC_CONNECT_PORT:-8086}:8083"
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/8083'"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks: ["lakehouse-network"]

  debezium-init:
    image: alpine/curl:8.21.0
    profiles: ["streaming"]
    scale: 0  # Run manually with docker compose run.
    entrypoint: ["/bin/sh", "/opt/debezium/register-connector.sh"]
    environment:
      DEBEZIUM_CONNECT_URL: http://debezium-connect:8083
      POSTGRES_CDC_USER: ${POSTGRES_CDC_USER:-debezium}
      POSTGRES_CDC_PASSWORD: ${POSTGRES_CDC_PASSWORD:-password}
      POSTGRES_ECOMMERCE_DB: ${POSTGRES_ECOMMERCE_DB:-ecommerce}
      CDC_TOPIC_PREFIX: ${CDC_TOPIC_PREFIX:-ecommerce}
    volumes:
      - ./infrastructure/debezium/register-connector.sh:/opt/debezium/register-connector.sh:ro
    depends_on:
      debezium-connect:
        condition: service_healthy
    restart: "no"
    networks: ["lakehouse-network"]

  flink-jobmanager:
    <<: *flink-common
    command: ["/opt/project/flink/bin/with-polaris-credentials.sh", "/docker-entrypoint.sh", "jobmanager"]
    ports:
      - "${FLINK_JOBMANAGER_PORT:-8085}:8081"
    environment:
      <<: *flink-environment
      JOB_MANAGER_RPC_ADDRESS: flink-jobmanager
    volumes:
      - ./pipelines:/opt/project/pipelines:ro
      - polaris-flink-credentials:/run/polaris:ro
      - flink-checkpoints:/opt/flink/checkpoints
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8081/overview || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    depends_on:
      kafka:
        condition: service_healthy
      polaris:
        condition: service_healthy

  flink-taskmanager:
    <<: *flink-common
    command: ["/opt/project/flink/bin/with-polaris-credentials.sh", "/docker-entrypoint.sh", "taskmanager"]
    environment:
      <<: *flink-environment
      JOB_MANAGER_RPC_ADDRESS: flink-jobmanager
    volumes:
      - ./pipelines:/opt/project/pipelines:ro
      - polaris-flink-credentials:/run/polaris:ro
      - flink-checkpoints:/opt/flink/checkpoints
    depends_on:
      flink-jobmanager:
        condition: service_started

  flink-submit:
    <<: *flink-common
    profiles: ["streaming"]
    scale: 0  # Run manually with docker compose run.
    command: ["/opt/project/flink/bin/with-polaris-credentials.sh", "/opt/project/flink/bin/submit-job.sh"]
    restart: "no"  # one-shot: submit job then exit
    volumes:
      - ./pipelines:/opt/project/pipelines:ro
      - polaris-flink-credentials:/run/polaris:ro
      - flink-checkpoints:/opt/flink/checkpoints
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      flink-jobmanager:
        condition: service_healthy
      flink-taskmanager:
        condition: service_started

  flink-cdc-submit:
    <<: *flink-common
    profiles: ["streaming"]
    scale: 0  # Run manually with docker compose run.
    command: ["/opt/project/flink/bin/with-polaris-credentials.sh", "/opt/project/flink/bin/submit-job.sh"]
    environment:
      <<: *flink-environment
      JOB_SCRIPT: /opt/project/pipelines/src/jobs/cdc/mysql_cdc_to_bronze.py
      JOB_NAME_PATTERN: oltp_cdc_to_bronze
    restart: "no"
    volumes:
      - ./pipelines:/opt/project/pipelines:ro
      - polaris-flink-credentials:/run/polaris:ro
      - flink-checkpoints:/opt/flink/checkpoints
    depends_on:
      debezium-init:
        condition: service_completed_successfully
      flink-jobmanager:
        condition: service_healthy
      flink-taskmanager:
        condition: service_started


networks:
  lakehouse-network:
    name: lakehouse-network

volumes:
  minio-data:
  postgres-data:
  polaris-provision-state:
  polaris-spark-client-credentials:
  polaris-spark-airflow-credentials:
  polaris-flink-credentials:
  polaris-trino-reader-credentials:
  airflow-logs:
  kafka-data:
  flink-checkpoints:
