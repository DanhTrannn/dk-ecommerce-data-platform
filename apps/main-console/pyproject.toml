[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "generator-console"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = [
  "data-generator",
  "PyYAML==6.0.2",
  "streamlit==1.66.1",
]

[project.scripts]
generator-console = "generator_console.launcher:main"

[tool.uv.sources]
data-generator = { workspace = true }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"
