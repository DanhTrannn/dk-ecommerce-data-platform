name: retail_lakehouse
version: '1.0.0'
config-version: 2
profile: retail_lakehouse
model-paths: [models]
macro-paths: [macros]
seed-paths: [seeds]
test-paths: [tests]
clean-targets: [target, dbt_packages]
models:
  retail_lakehouse:
    +materialized: iceberg_merge
    +schema: gold
    oltp:
      +tags: [oltp]
      # Every run rebuilds OLTP Gold from Silver; CREATE OR REPLACE is one Iceberg commit per table.
      +materialized: table
      +on_table_exists: replace
    silver:
      +schema: silver
      +tags: [silver]
      # An incremental run merges the Bronze rows written since the last merge, by primary key. A full refresh
      # rebuilds with CREATE OR REPLACE, since Polaris refuses DROP TABLE (purge).
      +materialized: incremental
      +incremental_strategy: merge
      +on_table_exists: replace
      # MERGE writes position-delete files; optimize folds them into the data files, which PyIceberg can then read.
      +post-hook: "ALTER TABLE {{ this }} EXECUTE optimize"
    logs:
      +tags: [logs]
seeds:
  retail_lakehouse:
    +schema: gold
    +tags: [oltp]
    # Polaris refuses DROP TABLE (purge); replace keeps the same table.
    +on_table_exists: replace
data_tests:
  retail_lakehouse:
    oltp:
      # Post-Gold checks only log; the blocking checks run before Silver changes.
      +severity: warn
flags:
  require_certificate_validation: true
