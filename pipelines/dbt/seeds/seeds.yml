version: 2
seeds:
- name: delivery_sla
  description: >
    Delivery promise per city. carrier_days is the upper bound of the GHTK Express range of the city's zone seen from
    the central warehouse in TP.HCM (price list from 10/11/2026; generator EDA section 7.2). sla_days adds one day of
    shop handling and one day of waiting for the carrier pickup, counted in Vietnamese calendar days from the order.
  config:
    column_types: {city_code: varchar, delivery_zone: varchar, carrier_days: integer, sla_days: integer}
- name: calendar_events
  description: >
    Vietnamese public holidays (Labour Code 2019 art. 112; lunar ones at their first day) and the sale days of the
    generator preset (11-11, Black Friday, 12-12) for the years of the loaded data.
  config:
    column_types: {event_date: date, event_type: varchar, event_name: varchar}
