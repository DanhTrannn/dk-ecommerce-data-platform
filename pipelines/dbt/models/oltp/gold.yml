version: 2
# Post-Gold checks: warn only (dbt_project.yml), results stay in the Airflow log.
models:
- name: dim_date
  columns:
  - name: date_day
    data_tests: [unique, not_null]
- name: dim_city
  columns:
  - name: city_key
    data_tests: [unique, not_null]
  - name: sla_days
    data_tests: [not_null]
- name: dim_store
  columns:
  - name: store_key
    data_tests: [unique, not_null]
- name: dim_product
  columns:
  - name: product_key
    data_tests: [unique, not_null]
- name: dim_variant
  columns:
  - name: variant_key
    data_tests: [unique, not_null]
- name: dim_customer
  columns:
  - name: customer_key
    data_tests: [unique, not_null]
- name: dim_staff
  columns:
  - name: staff_key
    data_tests: [unique, not_null]
- name: fact_order
  columns:
  - name: order_id
    data_tests: [unique, not_null]
  - name: status_group
    data_tests:
    - accepted_values:
        arguments:
          values: [completed, cancelled, failed, processing]
- name: fact_order_item
  columns:
  - name: order_item_id
    data_tests: [unique, not_null]
- name: fact_shipment
  columns:
  - name: shipment_id
    data_tests: [unique, not_null]
- name: fact_return
  columns:
  - name: return_item_id
    data_tests: [unique, not_null]
- name: fact_review
  columns:
  - name: review_id
    data_tests: [unique, not_null]
- name: mart_customer_value
  columns:
  - name: customer_key
    data_tests: [unique, not_null]
