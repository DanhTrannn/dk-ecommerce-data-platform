[project]
name = "batch-pipeline"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = [
  "PyYAML==6.0.2",
  "pymysql==1.1.1",
  "boto3==1.35.99",
  "pyarrow==18.1.0",
]

[project.optional-dependencies]
polars = [
  "polars==2.1.0",
  "pyiceberg[pyarrow,pyiceberg-core]==0.12.0",
  "psycopg2-binary==2.9.10",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"
