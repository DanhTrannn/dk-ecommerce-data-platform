[project]
name = "batch-pipeline"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = [
  "PyYAML==6.0.2",
  "boto3==1.35.99",
  "pyarrow==18.1.0",
  "dbt-core==1.11.11",
  "dbt-trino==1.11.0",
  "polars==2.1.0",
  "pyiceberg[pyarrow,pyiceberg-core]==0.12.0",
  "psycopg2-binary==2.9.10",
  "trino==0.340.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.package-data]
lakehouse = ["sql_templates/**/*.sql"]
